name: pokemon-api

services:
  db:
    image: postgres:17
    container_name: pokemon-db
    environment:
      POSTGRES_USER: pokemon
      POSTGRES_PASSWORD: pokemon
      POSTGRES_DB: pokemon
    ports:
      - "127.0.0.1:5433:5432"   # 只開給這台電腦。本機 5433 → 容器 5432，避開本機已經在跑的 PostgreSQL 18
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokemon -d pokemon"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "127.0.0.1:3000:3000"   # 只開給這台電腦
    environment:
      DATABASE_URL: postgresql://pokemon:REMOVED@db:5432/pokemon
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
